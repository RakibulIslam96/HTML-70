<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        var data = [4,4,-4,-1,0,-8,0,45,9,79,0];
        var pos = 0, neg = 0, zero  = 0, sum=0;
        for(i=0; i<data.length; i++){
            if (data[i]<0){
                neg++;
                sum+=data[i];
            }
            else if(data[i]>0){
                pos++;
                sum+=data[i];
            }
            else{
                zero++;
            }
        }
        document.write("Total Positive:" +pos + "<br>");
        document.write("Total Negative:" +neg + "<br>");
        document.write("Total Zero:" +zero + "<br>");
        document.write("Total Sum:"+sum + "<br>");
    </script>
</body>
</html>
