<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
</head>

<body>

    <div style="
        width: 320px;
        height: auto;
        background-color:rgb(226, 227, 228);
        padding: 40px;
        margin: auto;
        margin-top: 60px;
        box-shadow: 0 0  10px gray;
        border-radius: 10px;
        font-family: sans-serif;
        ">
        <form name="form">
            Name: <br>
            <input type="text" name="n"> <br> <br>

            E-mail: <br>
            <input type="text" name="e"> <br> <br>

            Password: <br>
            <input type="password" name="p"> <br> <br>

            Course: <br>
            <input type="checkbox" name="cbox" value="HTML"> HTML
            <input type="checkbox" name="cbox" value="CSS"> CSS
            <input type="checkbox" name="cbox" value="JavaScript"> JavaScript <br> <br>

            Gender: <br>
            <input type="radio" name="g" value="male"> Male
            <input type="radio" name="g" value="Female"> Female
            <input type="radio" name="g" value="others"> others <br> <br>

            Department:
            <select>
                <option>Select here</option>
                <option>B.S.C</option>
                <option>C.S.C</option>
                <option>H.S.C</option>
                <option>J.S.C</option>
                <option>P.S.C</option>
            </select>
            <br> <br>
            <input type="button" value="Submit" onclick="info()">
            <input type="reset" value="Reset">
        </form>
    </div>

    <script>
        function info() {
            var name = document.form.n.value;
            var email = document.form.e.value;
            var password = document.form.p.value;

            if (name == "") {
                alert("please enter your name");

            }

            if (password.length < 5 || password.length > 8) {
                alert("Password must be between 5 to 8 characters");
                return false;
            }

        }

        //pop up window//

        var store = window.open("", "", "width= 450, height=450");
        store.document.write(`
        <div style="
        width:320px;
        margin:50px auto;
        padding: 20px;
        border: 1px solid gray;
        border-radius: 10px;
        box-shadow: 0 0 10px gray;
        font-family: sans-serif;
        background-color: #f5f5f5;
        ">
        </div>
        `);
    </script>

</body>

</html>
