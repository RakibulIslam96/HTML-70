<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div
        style="max-width:400px;background-color:rgb(216, 216, 215);padding:30px;margin:auto;text-align:left;border-radius:8px;">
        <form action="#" name="f">
            Name: <br>
            <input type="text" name="n"> <br> <br>

            G-mail: <br>
            <input type="email" name="e" id=""> <br> <br>

            Address: <br>
            <textarea name="ad" id="" cols="30"></textarea> <br> <br>


            Course:
            <select name="s" id="">
                <option value="MBA">MBA</option>
                <option value="CSC">CSC</option>
                <option value="BSC">BSC</option>
                <option value="BCS">BCS</option>
                <option value="BSS">BSS</option>
            </select>
            <br> <br>
            Subjects:
            <input type="checkbox" name="Subject" id="" value="Bangla">Bangla
            <input type="checkbox" name="Subject" id="" value="English">English
            <input type="checkbox" name="Subject" id="" value="Math">Math
            <br> <br>

            Gender:
            <input type="radio" name="s1" id="" value="Male">Male
            <input type="radio" name="s1" id="" value="Female">Female
            <input type="radio" name="s1" id="" value="Others">Others
            <br> <br>

            <button type="submit" onclick="info()">Submit</button>
            <button type="reset">Reset</button>
        </form>
    </div>

    <script>
        function info() {
            var name = document.f.n.value;
            var ad = document.f.ad.value;
            var email = document.f.e.value;
            var select = document.f.s.value;

            // Email Validation
            var pattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
            if (!email.match(pattern)) {
                alert("Please enter a valid email");
                return false; // function stop হবে
            }

            // Subject collect করা
            var sub = "";
            for (var i = 0; i < document.f.Subject.length; i++) {
                if (document.f.Subject[i].checked) {
                    sub += document.f.Subject[i].value + " , ";
                }
            }

            // Gender collect করা
            var gender = "";
            for (var i = 0; i < document.f.s1.length; i++) {
                if (document.f.s1[i].checked) {
                    gender = document.f.s1[i].value;
                }
            }

            // Window open এবং data দেখানো
            var store = window.open("", "", "width=400px, height=500px");
            store.document.write("Student Name: " + name + "<br>");
            store.document.write("Address: " + ad + "<br>");
            store.document.write("E-mail: " + email + "<br>");
            store.document.write("Course: " + select + "<br>");
            store.document.write("Subjects: " + sub + "<br>");
            store.document.write("Gender: " + gender + "<br>");
            store.document.write("<button onclick='window.close()'>Close me</button> ");
            store.document.write("<button onclick='window.print()'>Print</button> ");
        }
    </script>
</body>

</html>
