<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        let num = parseInt(prompt("Enter a number"));
        if (num >= 80) {
            document.write("Your Grading is 'A+' ");
        }
        else if (num >= 70) {
            document.write("Your Grading is 'A' ");
        }
        else if (num >= 60) {
            document.write("Your Grading is 'A-' ");
        }
        else if (num >= 50) {
            document.write("Your Grading is 'B' ");
        }
        else if (num >= 40) {
            document.write("Your Grading is 'c' ");
        }
        else if (num >= 33) {
            document.write("Your Grading is 'D' ");
        }
        else {
            document.write("Fail");
        }
    </script>

</body>

</html>
