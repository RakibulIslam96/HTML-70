<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        const car = {
            name: "BMW",
            model: "500",
            weight: "850 KG",
            color: "White",

            start: function () {
                return "My " + this.name + " is starting";
            },

            stop: function () {
                return "My " + this.name + " is stopped now";
            }
        };

        document.write(car.stop() + "<br>");
        document.write(car.weight + "<br>");
        document.write(car.start());

    </script>

</body>

</html>
