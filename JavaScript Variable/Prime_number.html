<!DOCTYPE html>
<html>

<head>
    <title>Prime Check</title>
</head>

<body>

    <script>
        let num = parseInt(prompt("Enter a number:"));

        if (num === 0) {
            document.write("0 is neither Prime nor Composite");
        }
        else if (num === 1) {
            document.write("1 is neither Prime nor Composite");
        }
        else {
            let prime = true;

            for (let i = 2; i < num; i++) {
                if (num % i === 0) {
                    prime = false;
                    break;
                }
            }
            var aa= prime? (num + " is a Prime Number"): (num + " is a Composite Number");

            document.write(aa);
        //     if (prime) {
        //         document.write(num + " is a Prime Number");
        //     } else {
        //         document.write(num + " is a Composite Number");
        //     }
         }
    </script>
</body>

</html>
