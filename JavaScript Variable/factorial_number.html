<!DOCTYPE html>
<html>

<head>
    <title>Factorial</title>
</head>

<body>

    <script>
        let num = parseInt(prompt("Enter a number:"));

        let fact = 1;

        if (num < 0) {
            document.write("Factorial is not possible for negative numbers");
        }
        else {
            for (let i = 1; i <= num; i++) {
                document.write(fact+"*" + i + " = " + fact*i+"<br>");
                fact = fact * i;
                
            }

            document.write("Factorial of " + num + " = " + fact);
        }
    </script>

</body>

</html>
